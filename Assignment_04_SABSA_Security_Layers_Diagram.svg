 </marker>
</defs>
<rect width="1600" height="1100" fill="#F5F7FB"/>
<rect x="0" y="0" width="1600" height="16" fill="#15958D"/>
<text x="64" y="60" font-family="Arial" font-size="19" font-weight="700" letter-spacing="2" fill="#2E6FAD">SPPU  •  B.E. AI &amp; DS  •  2019 PATTERN</text>
<text x="1535" y="60" text-anchor="end" font-family="Arial" font-size="18" font-weight="700" fill="#65788D">COMPUTER LABORATORY – II  /  EXPERIMENT 04</text>
<text x="64" y="126" font-family="Arial" font-size="38" font-weight="700" fill="#17324D">SABSA Enterprise Security Architecture</text>
<text x="66" y="164" font-family="Arial" font-size="19" fill="#65788D">Six-layer, risk-driven security architecture with controls mapped to three business domains</text>
<line x1="64" y1="190" x2="1536" y2="190" stroke="#D9E2EC" stroke-width="2"/>
<text x="800" y="235" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#17324D" text-anchor="middle">SABSA SECURITY ARCHITECTURE – SIX CONNECTED LAYERS</text><rect x="400" y="270" width="800" height="88" rx="16" fill="#E8F1FA" stroke="#D8E2EC" stroke-width="2" filter="url(#shadow)"/><rect x="400" y="270" width="8" height="88" rx="4" fill="#2E6FAD"/><text x="800.0" y="309.0" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#17324D" text-anchor="middle">BUSINESS ATTRIBUTES</text><text x="800.0" y="337.0" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#65788D" text-anchor="middle">Business drivers • objectives • security requirements</text><path d="M800 358 L800 382" fill="none" stroke="#A9B9C9" stroke-width="3" marker-end="url(#arrow)"/><rect x="400" y="382" width="800" height="88" rx="16" fill="#E5F4F1" stroke="#D8E2EC" stroke-width="2" filter="url(#shadow)"/><rect x="400" y="382" width="8" height="88" rx="4" fill="#15958D"/><text x="800.0" y="421.0" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#17324D" text-anchor="middle">INFORMATION ATTRIBUTES</text><text x="800.0" y="449.0" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#65788D" text-anchor="middle">Data classification • confidentiality • integrity</text><path d="M800 470 L800 494" fill="none" stroke="#A9B9C9" stroke-width="3" marker-end="url(#arrow)"/><rect x="400" y="494" width="800" height="88" rx="16" fill="#F0EDFA" stroke="#D8E2EC" stroke-width="2" filter="url(#shadow)"/><rect x="400" y="494" width="8" height="88" rx="4" fill="#7967B2"/><text x="800.0" y="533.0" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#17324D" text-anchor="middle">APPLICATION ATTRIBUTES</text><text x="800.0" y="561.0" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#65788D" text-anchor="middle">Secure business applications • workflows • services</text><path d="M800 582 L800 606" fill="none" stroke="#A9B9C9" stroke-width="3" marker-end="url(#arrow)"/><rect x="400" y="606" width="800" height="88" rx="16" fill="#FBF2E1" stroke="#D8E2EC" stroke-width="2" filter="url(#shadow)"/><rect x="400" y="606" width="8" height="88" rx="4" fill="#D99B32"/><text x="800.0" y="645.0" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#17324D" text-anchor="middle">TECHNOLOGY ATTRIBUTES</text><text x="800.0" y="673.0" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#65788D" text-anchor="middle">Network security • encryption • access controls</text><path d="M800 694 L800 718" fill="none" stroke="#A9B9C9" stroke-width="3" marker-end="url(#arrow)"/><rect x="400" y="718" width="800" height="88" rx="16" fill="#F9EAE8" stroke="#D8E2EC" stroke-width="2" filter="url(#shadow)"/><rect x="400" y="718" width="8" height="88" rx="4" fill="#D96C62"/><text x="800.0" y="757.0" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#17324D" text-anchor="middle">PHYSICAL ATTRIBUTES</text><text x="800.0" y="785.0" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#65788D" text-anchor="middle">Facilities • data centres • infrastructure protection</text><path d="M800 806 L800 830" fill="none" stroke="#A9B9C9" stroke-width="3" marker-end="url(#arrow)"/><rect x="400" y="830" width="800" height="88" rx="16" fill="#EAF5ED" stroke="#D8E2EC" stroke-width="2" filter="url(#shadow)"/><rect x="400" y="830" width="8" height="88" rx="4" fill="#4B9B70"/><text x="800.0" y="869.0" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#17324D" text-anchor="middle">PEOPLE &amp; IDENTITY</text><text x="800.0" y="897.0" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#65788D" text-anchor="middle">Roles • identity management • authentication</text><text x="800" y="980" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#17324D" text-anchor="middle">DOMAIN-SPECIFIC SECURITY OUTCOMES</text><rect x="65" y="995" width="480" height="42" rx="16" fill="#E8F1FA" stroke="#D8E2EC" stroke-width="2" filter="url(#shadow)"/><rect x="65" y="995" width="8" height="42" rx="4" fill="#2E6FAD"/><text x="305.0" y="1011.0" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#17324D" text-anchor="middle">FINANCE</text><text x="305.0" y="1039.0" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#65788D" text-anchor="middle">Encrypt customer / transaction data • fraud detection • PCI DSS controls</text><rect x="575" y="995" width="480" height="42" rx="16" fill="#F9EAE8" stroke="#D8E2EC" stroke-width="2" filter="url(#shadow)"/><rect x="575" y="995" width="8" height="42" rx="4" fill="#D96C62"/><text x="815.0" y="1011.0" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#17324D" text-anchor="middle">DEFENSE</text><text x="815.0" y="1039.0" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#65788D" text-anchor="middle">Protect classified information • secure communications • physical security</text><rect x="1085" y="995" width="480" height="42" rx="16" fill="#E5F4F1" stroke="#D8E2EC" stroke-width="2" filter="url(#shadow)"/><rect x="1085" y="995" width="8" height="42" rx="4" fill="#15958D"/><text x="1325.0" y="1011.0" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#17324D" text-anchor="middle">AGRICULTURE</text><text x="1325.0" y="1039.0" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#65788D" text-anchor="middle">Protect farm IoT • data integrity • supply-chain traceability</text><line x1="64" y1="1040" x2="1536" y2="1040" stroke="#D9E2EC" stroke-width="2"/>
<text x="66" y="1073" font-family="Arial" font-size="15" fill="#65788D">BE • Artificial Intelligence &amp; Data Science • SPPU 2019 Pattern</text>
